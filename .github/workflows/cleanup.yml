name: Cleanup Failed Runs

on:
  push:
    branches: [ main ]

permissions:
  actions: write

jobs:
  delete-failed:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Failed Workflow Runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting failed runs..."
          gh api --method DELETE /repos/404kernel/bound/actions/runs/39472908548 || true
          gh api --method DELETE /repos/404kernel/bound/actions/runs/39470940974 || true
          gh api --method DELETE /repos/404kernel/bound/actions/runs/39451254580 || true
          echo "Cleanup complete."
