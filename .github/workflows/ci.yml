name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22', '1.23']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}

      - name: Run Tests
        run: go test -v -race ./...
        if: matrix.os != 'windows-latest'

      - name: Run Tests (Windows)
        run: go test -v ./...
        if: matrix.os == 'windows-latest'

      - name: Build Binary
        run: go build -v ./cmd/bound
