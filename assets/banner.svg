<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090A0F" />
      <stop offset="50%" stop-color="#0F111A" />
      <stop offset="100%" stop-color="#141824" />
    </linearGradient>

    <!-- Glowing Accents -->
    <radialGradient id="glow-primary" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7D56F4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7D56F4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="70%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#00D7FE" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#00D7FE" stop-opacity="0" />
    </radialGradient>

    <!-- Wordmark Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Accent Line Gradient -->
    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D56F4" stop-opacity="0" />
      <stop offset="25%" stop-color="#7D56F4" />
      <stop offset="50%" stop-color="#00D7FE" />
      <stop offset="75%" stop-color="#04B575" />
      <stop offset="100%" stop-color="#04B575" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="shield-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7D56F4" />
      <stop offset="50%" stop-color="#00D7FE" />
      <stop offset="100%" stop-color="#04B575" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" rx="16" fill="url(#bg)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid)" />

  <!-- Ambient Light Halos -->
  <circle cx="350" cy="160" r="320" fill="url(#glow-primary)" />
  <circle cx="850" cy="200" r="280" fill="url(#glow-cyan)" />

  <!-- Outer Border -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5" />

  <!-- Central Shield Vault Emblem -->
  <g transform="translate(140, 110)">
    <!-- Outer Shield Hexagon -->
    <path d="M 70 0 L 140 38 L 140 102 L 70 140 L 0 102 L 0 38 Z" fill="#131722" stroke="url(#shield-grad)" stroke-width="3" filter="drop-shadow(0 0 16px rgba(125,86,244,0.5))" />
    
    <!-- Inner Vault Rings -->
    <circle cx="70" cy="70" r="38" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,4" />
    <circle cx="70" cy="70" r="26" fill="#1E293B" stroke="#00D7FE" stroke-width="2.5" />
    <circle cx="70" cy="70" r="10" fill="#7D56F4" />

    <!-- Lock Shackle Bolt -->
    <path d="M 60 52 L 60 42 C 60 36 80 36 80 42 L 80 52" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(330, 150)">
    <!-- Main Wordmark -->
    <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="78" font-weight="900" letter-spacing="14" fill="url(#text-grad)">BOUND</text>

    <!-- Version / Status Pill -->
    <rect x="420" y="-8" width="86" height="28" rx="14" fill="#7D56F4" fill-opacity="0.2" stroke="#7D56F4" stroke-width="1" />
    <text x="463" y="11" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="700" fill="#00D7FE" text-anchor="middle">v0.1.0</text>

    <!-- Subtitle -->
    <text x="4" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="18" font-weight="500" letter-spacing="2.5" fill="#94A3B8">
      THE PROGRAMMABLE SPEND VAULT &amp; FINANCIAL RAILS FOR AI AGENTS
    </text>

    <!-- Tagline Badges -->
    <g transform="translate(4, 122)">
      <text font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#04B575">
        ● &lt;2ms LATENCY
      </text>
      <text x="140" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#64748B">|</text>
      <text x="160" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#00D7FE">
        ● ZERO-TRUST GOVERNANCE
      </text>
      <text x="375" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#64748B">|</text>
      <text x="395" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="12" font-weight="600" fill="#FFB86C">
        ● RUNAWAY LOOP BREAKER
      </text>
    </g>
  </g>

  <!-- Bottom Accent Gradient Line -->
  <rect x="100" y="325" width="1000" height="2" rx="1" fill="url(#line-grad)" />
</svg>
